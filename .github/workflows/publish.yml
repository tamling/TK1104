name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.42
      # The dark theme is configured in _quarto.yml (light/dark themes →
      # a toggle on every page); the figures are pre-built SVGs committed
      # under chapters/figures/, so no LaTeX is needed here.
      - run: quarto render
      # Password-protect the published site: drop the plain-text search
      # (the salt is pinned so that remembered logins survive re-deploys;
      # changing the password does NOT require changing the salt)
      # index and AES-encrypt every page with StatiCrypt (students unlock
      # once per browser; "remember me" keeps it open for 30 days). To
      # change the password without a code change, add a repository
      # secret named STATICRYPT_PASSWORD - it overrides the default below.
      - name: Password-protect site
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD || 'TK1104-2026' }}
        run: |
          npm install -g staticrypt
          rm -f _site/search.json
          find _site -name '*.html' | while read -r f; do
            staticrypt "$f" -d "$(dirname "$f")" -p "$STATICRYPT_PASSWORD" \
              --short --remember 365 \
              --salt b6c1193f0a2f31be3a0e2f0b6a8f4c27 \
              --template _interactive/staticrypt_template.html \
              --template-title "TK1104 - Course Script" \
              --template-instructions "This course script is for TK1104 students. Enter the password from Canvas." \
              --template-button "Open the script" \
              --template-color-primary "#d81e2e" \
              --template-color-secondary "#595959" > /dev/null
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
