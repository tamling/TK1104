project:
  type: book
  output-dir: _site

# ── Annotations (Hypothesis) ─────────────────────────────────────────────
# Same setup as the SKY2100 script: ON by default - every HTML page loads
# the Hypothesis client (see includes/hypothesis.html) so students can
# annotate directly. Set to false (and drop include-in-header below) to
# switch the layer off again.
annotations: true

book:
  title: "TK1104 - Digital Technology"
  # Search is off on purpose: the published site is password-protected
  # (StatiCrypt in .github/workflows/publish.yml), and the search index
  # (search.json) would otherwise carry the full text in plain text.
  search: false
  subtitle: "Lecture script - a companion to the twelve lectures"
  author: "Timo Amling"
  chapters:
    - index.qmd
    - chapters/01-introduction-everything-is-bits.qmd
    - chapters/02-binary-hex-twos-complement.qmd
    - chapters/03-text-and-multimedia.qmd
    - chapters/04-how-the-machine-computes.qmd
    - chapters/05-operating-systems.qmd
    - chapters/06-the-internet.qmd
    - chapters/07-the-application-layer.qmd
    - chapters/08-the-transport-layer.qmd
    - chapters/09-the-network-layer.qmd
    - chapters/10-the-link-layer.qmd
    - chapters/11-repetition.qmd
    # Second, independent part of the site: one exam-style quiz per
    # session (pages are unnumbered so the script keeps chapters 1-11).
    # Generated from _interactive/make_tasks.py like the in-chapter tasks.
    - part: "Session quizzes"
      chapters:
        - quizzes/quiz-01.qmd
        - quizzes/quiz-02.qmd
        - quizzes/quiz-03.qmd
        - quizzes/quiz-04.qmd
        - quizzes/quiz-05.qmd
        - quizzes/quiz-06.qmd
        - quizzes/quiz-07.qmd
        - quizzes/quiz-08.qmd
        - quizzes/quiz-09.qmd
        - quizzes/quiz-10.qmd
        - quizzes/quiz-11.qmd
  appendices:
    - appendix/abbreviations.qmd
    - appendix/revision-history.qmd

format:
  html:
    # Every page gets both a light and a dark theme; Quarto renders the
    # toggle in the navbar of every page. theme.scss carries the shared
    # course styling (bridges, boxes), theme-dark.scss the dark-mode
    # fixes (light backing card behind the SVG figures).
    theme:
      light: [cosmo, theme.scss]
      dark: [darkly, theme.scss, theme-dark.scss]
    toc: true
    number-sections: true
    include-in-header: includes/hypothesis.html
    # Interactive self-check engine (sort / order / input tasks): loaded
    # on every page; the tasks themselves are generated snippets under
    # chapters/_tasks/ - see _interactive/make_tasks.py.
    include-after-body: includes/interactive.html
